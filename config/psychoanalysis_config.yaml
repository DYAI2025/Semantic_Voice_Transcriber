# config/psychoanalysis_config.yaml

# Provider selection: "openai" or "ollama"
provider: ollama  # Use free local Ollama by default

openai:
  api_key: ${OPENAI_API_KEY}  # Read from environment variable
  model: gpt-4-turbo-preview
  max_tokens: 4096
  temperature: 0.3

retries:
  max_attempts: 3
  base_delay: 2.0
  max_delay: 30.0
  jitter: 1.0

# Ollama settings (FREE, runs locally)
ollama:
  base_url: http://localhost:11434
  model: qwen2.5-coder:7b  # Must be downloaded with: ollama pull qwen2.5-coder:7b
  max_tokens: 4000
  temperature: 0.7

cache:
  enabled: true
  directory: Transkripte_LLM
  hash_algorithm: sha256

privacy:
  show_real_names: false
  pseudonymize_speakers: true

turnpoints:
  valence_threshold: 0.5
  arousal_threshold: 0.3
  prosody_pause_threshold_ms: 2000
  significance_levels:
    - low
    - medium
    - high

markers:
  ato_directory: VP_ATO/psychoanalytic
  categories:
    - defense
    - resistance
    - transference
    - theme

dashboard:
  output_directory: Transkripte_LLM
  auto_open_browser: true
  template: dashboard_template.html
