name: Feature Audit

on:
  pull_request:
    branches:
      - feat/professional-quality-enhancement
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt jsonschema
      - name: Run audit
        run: |
          python -m audit.cli --session session1 --json reports/audit.json --markdown reports/audit.md
      - name: Enforce readiness gate
        run: |
          python scripts/check_readiness_gate.py reports/audit.json
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: reports/
