name: Build Installers

on:
  workflow_dispatch:
  push:
    branches:
      - feat/professional-quality-enhancement

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build NSIS installer
        run: |
          choco install nsis -y
          makensis installer\windows\svt_lite.nsi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svt-lite-installer
          path: SVT-Lite-Setup.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build app bundle
        run: |
          bash installer/macos/build_app.sh
          hdiutil create -volname SVT -srcfolder dist/SVT.app -ov -format UDZO dist/SVT.dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svt-macos-dmg
          path: dist/SVT.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build AppDir
        run: |
          bash installer/linux/build_appimage.sh
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage dist/SVT.AppDir dist/SVT.AppImage
          bash installer/linux/build_deb.sh
          dpkg-deb --build dist/svt-deb dist/svt.deb
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: svt-linux-artifacts
          path: |
            dist/SVT.AppImage
            dist/svt.deb
