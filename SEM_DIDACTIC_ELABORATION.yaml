  - "Der Ansatz von Satir betont Ressourcen. Das bedeutet konkret: Wir suchen nach bereits vorhandenen Stärken."
  - "Wie sollen wir Suggestion nennen? Erickson unterscheidet direkte und indirekte Formen. Präziser gesagt..."
  - "Was heißt Dissoziation therapeutisch? Aus psychoanalytischer Sicht ist das eine Abwehrfunktion. Anders formuliert..."
