[pytest]
# Pytest configuration for Semantic Voice Transcriber
# Updated: 2025-11-21 (Phase 1.2 - Test Reorganization)

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: integration tests requiring external dependencies
    ci: fast tests suitable for CI/CD pipeline
    audio: tests requiring audio files
    llm: tests requiring LLM API access
    prosody: prosody analysis tests
    diarization: speaker diarization tests
    transcription: transcription engine tests
    output: output formatting tests
    memory: memory/database tests
    semantic: semantic analysis tests

# Coverage options (optional)
# Uncomment to enable coverage reporting
# addopts = --cov=svt_core --cov-report=html --cov-report=term

# Ignore paths
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    venv
    env
    Eingang
    Transkripte_LLM
    Memory
    Output
    cache
    __pycache__
    .pytest_cache

# Timeout for tests (optional)
# timeout = 300

# Logging
log_cli = false
log_cli_level = INFO
log_file = pytest.log
log_file_level = DEBUG
