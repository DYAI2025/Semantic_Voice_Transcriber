## VORGESCHLAGENE SEM-KOMPOSITIONEN

### SEM_COLLABORATIVE_ALLIANCE

```yaml
id: SEM_COLLABORATIVE_ALLIANCE
version: '4.1'
category: SEMANTIC
description: Kollaborative therapeutische Allianz wird aktiv hergestellt
composed_of:
- ATO_WE_LANGUAGE
- ATO_COLLABORATIVE_FRAMING
- ATO_VALIDATION_THERAPIST
activation_logic: ANY 2 of 3
window:
  messages: 5
therapeutic_value: HIGH
rationale: |
  Stärkerer Indikator für therapeutische Allianz als WE_LANGUAGE allein.
  Zeigt aktive Ko-Konstruktion, nicht nur grammatische "wir"-Nutzung.
```

